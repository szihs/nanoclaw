name: Compose Check

# Validates the tree that SETUP actually ships — the deploy compose onto
# nv-coworkers (compose_fork merges nv-main, then merge-train adds each project)
# — not the nv-main-based fan-merge in ci.yml. Those bases differ by hundreds of
# lines on shared files, so a green ci.yml does NOT prove the shipped tree builds.
#
# Runs the real merge-train resolver (owned set canonicalized to nv-main) and
# then builds + typechecks + validate:templates + tests the composed tree. A
# non-building compose fails the job — the regression guard for the whole fork.
#
# Push-triggered (post-merge): a break shows as a red check on whichever branch
# introduced it. ci.yml already provides the pre-merge composed-state check.

on:
  push:
    branches: [nv-main, nv-coworkers, nv-slang, nv-slangpy, nv-nanoclaw, nv-dashboard]

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: nv-coworkers
          fetch-depth: 0

      - name: Compose the deploy tree (nv-main + every project overlay)
        # HUSKY=0: merge-train's git commits run here, before pnpm is set up, so
        # the husky pre-commit hook (which needs pnpm) must be disabled.
        env:
          HUSKY: "0"
        run: |
          set -e
          git config user.name "CI"
          git config user.email "ci@nanoclaw"
          # Use nv-main's merge-train.sh (the owned-canonical resolver) even
          # though we start from nv-coworkers, whose copy may lag. Commit it so
          # the working tree is clean for the first merge.
          git fetch origin nv-main
          git checkout origin/nv-main -- setup/merge-train.sh
          git commit -qm "compose-check: use nv-main's merge-train resolver" -- setup/merge-train.sh
          # MERGE_TRAIN_NO_INSTALL: merge + canonicalize every branch, then run a
          # single install/build/validate below (faster than per-branch, and the
          # explicit build is the oracle for a non-building compose).
          MERGE_TRAIN_NO_INSTALL=1 bash setup/merge-train.sh \
            nv-main nv-slang nv-slangpy nv-nanoclaw nv-dashboard
          echo "composed HEAD: $(git log --oneline -1)"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - run: pnpm install --frozen-lockfile

      # This job composes with the REAL merge train, so it is the one place CI
      # reproduces the silent failure: canonicalization drops a leaf's root
      # manifest edit, install stays green, build stays green, and the consumer
      # reports "unavailable" forever. ci.yml is pull_request-only and cannot
      # cover this path.
      - name: Assert runtime specifiers resolve in the composed deploy tree
        run: pnpm run check:runtime-deps

      - name: Install agent-runner deps (Bun)
        working-directory: container/agent-runner
        run: bun install --frozen-lockfile

      - name: Build (needed for fetch-skills + tests)
        run: pnpm run build

      - name: Upgrade gh CLI (need >= 2.90 for gh skill)
        run: |
          gh --version
          gh extension install github/gh-skill 2>/dev/null || true
          gh skill --help >/dev/null 2>&1 || {
            echo "Installing latest gh CLI..."
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update -qq && sudo apt-get install -y -qq gh
          }
          gh --version

      - name: Fetch external skills
        if: hashFiles('scripts/fetch-skills.sh') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/fetch-skills.sh

      - name: Typecheck host
        run: pnpm exec tsc --noEmit

      - name: Typecheck container
        run: pnpm exec tsc -p container/agent-runner/tsconfig.json --noEmit

      - name: Validate coworker templates
        run: pnpm run validate:templates

      - name: Host tests
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm exec vitest run

      - name: Container tests
        working-directory: container/agent-runner
        run: bun test
