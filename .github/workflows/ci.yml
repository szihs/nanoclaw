name: CI

on:
  pull_request:
    branches: [main, nv-main, nv-dashboard, nv-slang, nv-slangpy, nv-nanoclaw]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Merge nv-* branches (test the composed state, not standalone)
        if: github.base_ref != 'main'
        run: |
          set -e
          git config user.name "CI"
          git config user.email "ci@nanoclaw"
          BASE="${{ github.base_ref }}"

          # Canonical source for the owned infra set on conflict.
          #   - PR to a LEAF (nv-dashboard/slang/...): HEAD is the leaf, whose
          #     owned files are stale copies — take `origin/nv-main`. `--ours`
          #     would keep the leaf's stale package.json while the lockfile
          #     auto-merges nv-main's deps, breaking `pnpm install --frozen`.
          #   - PR to nv-main: HEAD *is* the proposed nv-main. `origin/nv-main`
          #     is the OLD base, so checking it out would silently REVERT the
          #     PR's own change to any owned file that a leaf also touches (the
          #     PR could never be validated). Take HEAD instead.
          if [ "$BASE" = "nv-main" ]; then OWNED_SRC="HEAD"; else OWNED_SRC="origin/nv-main"; fi

          # Fetch nv-main up front so `git checkout origin/nv-main -- <f>` has
          # the ref even when nv-main is the BASE (skipped by the merge loop).
          git fetch origin nv-main || { echo "::error::failed to fetch nv-main"; exit 1; }

          # nv-main canonically owns the shared infra files (package.json,
          # lockfiles, .github/**) per .github/nv-path-guard/nv-main.txt.
          # Sibling overlay branches carry their own stale copies of these that
          # always conflict during the composed-state merge — package.json
          # version bumps, and a lagging .github/workflows/ci.yml whenever this
          # very workflow is updated. Auto-resolve conflicts in that owned set
          # by taking the integration side; any conflict OUTSIDE the owned set
          # is a real content regression and must fail loudly.
          #
          # The previous `git merge 2>/dev/null || merge --abort` silently
          # dropped an entire branch's content on a trivial package.json clash,
          # which hid the base-nanoclaw / validate:templates breakage for weeks.
          #
          # OWNED = files nv-main is canonical for on conflict. The SINGLE source
          # of truth is nv-main's path-guard allowlist (.github/nv-path-guard/
          # nv-main.txt), read from $OWNED_SRC — HEAD for a nv-main PR (whose own
          # allowlist edit must apply to itself), origin/nv-main for a leaf PR.
          # BOTH the allowlist and the MATCHER come from $OWNED_SRC, and the
          # matcher is the one every other reader uses (check.py imports it;
          # check-nv-owned-drift.sh shells out to it). This used to run
          # `git -c core.excludesFile=<list> check-ignore` HERE, in the project
          # repo, which also consults its .gitignore, .git/info/exclude and the
          # global excludes — and this repo's .gitignore alone would hand nv-main
          # ownership of groups/**, data/**, dist/**, repos/**, coworkers/*.yaml
          # and forks.md. A conflict in any of those would then be auto-resolved
          # toward nv-main instead of failing loudly, silently dropping an
          # overlay's content: the exact regression this block exists to catch.
          # Mirrors setup/merge-train.sh and setup.sh's compose_fork.
          NV_OWNED_LIST=$(mktemp)
          git show "$OWNED_SRC":.github/nv-path-guard/nv-main.txt > "$NV_OWNED_LIST" 2>/dev/null || true
          NV_MATCHER=$(mktemp)
          git show "$OWNED_SRC":.github/nv-path-guard/ownership.py > "$NV_MATCHER" 2>/dev/null || true
          # NUL-delimited candidates in, NUL-delimited owned paths out, one call.
          nv_owned() {
            [ -s "$NV_OWNED_LIST" ] && [ -s "$NV_MATCHER" ] || return 1
            python3 "$NV_MATCHER" -0 "$NV_OWNED_LIST"
          }
          # Exact membership in a NUL set file; `grep -z` is GNU-only.
          nv_set_has() {
            local set_file="$1" want="$2" got
            while IFS= read -r -d '' got; do
              [ "$got" = "$want" ] && return 0
            done < "$set_file"
            return 1
          }
          if ! printf 'probe\0' | nv_owned >/dev/null 2>&1; then
            echo "::error::cannot evaluate nv-main ownership from $OWNED_SRC"
            exit 1
          fi

          for branch in nv-main nv-dashboard nv-slang nv-slangpy nv-nanoclaw; do
            [ "$branch" = "$BASE" ] && continue
            git fetch origin "$branch" || { echo "::error::failed to fetch $branch"; exit 1; }

            # Plain merge — do NOT use -X ours: a genuine overlay content
            # conflict must surface, not be silently resolved toward HEAD
            # (that would drop a leaf's newer content). Only owned infra files
            # are auto-resolved, below.
            if git merge "origin/$branch" --no-edit; then
              continue
            fi

            CONFLICTS=$(git diff --name-only --diff-filter=U)
            CONFLICTS_OWNED=$(mktemp)
            printf '%s\0' $CONFLICTS | nv_owned > "$CONFLICTS_OWNED" || : > "$CONFLICTS_OWNED"
            UNEXPECTED=""
            for f in $CONFLICTS; do
              nv_set_has "$CONFLICTS_OWNED" "$f" || UNEXPECTED="$UNEXPECTED $f"
            done
            if [ -n "$UNEXPECTED" ]; then
              echo "::error::$branch merge produced conflicts outside nv-main's owned set:"
              printf '  %s\n' $UNEXPECTED
              git merge --abort
              exit 1
            fi

            # All conflicts are owned infra — take the canonical version
            # ($OWNED_SRC: origin/nv-main for leaf PRs, HEAD for nv-main PRs;
            # see the comment where OWNED_SRC is set).
            for f in $CONFLICTS; do
              echo "::notice::$branch: $f conflict — taking $OWNED_SRC (canonical) version"
              # A delete/modify conflict (file removed on the canonical side,
              # edited on the other) has no blob to check out — honor the
              # deletion so the composed merge doesn't strand a half-resolved path.
              if git checkout "$OWNED_SRC" -- "$f" 2>/dev/null; then
                git add -- "$f"
              else
                echo "::notice::$branch: $f absent on $OWNED_SRC — taking the deletion"
                # `git rm -f` stages the deletion itself, so `git add -A` after
                # it SUCCEEDS is fatal rather than redundant: the path is gone
                # from both worktree and index, git answers `pathspec did not
                # match any files` and exits 128, killing the step under
                # `bash -e`. add -A belongs only on the fallback path, where a
                # plain `rm` left the index untouched.
                git rm -f -- "$f" >/dev/null 2>&1 || { rm -f "$f"; git add -A -- "$f"; }
              fi
            done
            git commit --no-edit
          done
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      # Before the install, because the install is what the policy governs.
      # The three-day quarantine sat inert for months — `minimumReleaseAge` was
      # nested under a `pnpm:` key that pnpm ignores in silence — and nothing
      # could tell the difference between enforced and decorative. This probes
      # pnpm for the answer instead of reading the file and assuming.
      - name: Assert the release-age policy is visible to pnpm
        run: bash scripts/check-release-age-policy.sh

      - run: pnpm install --frozen-lockfile

      # A green frozen install proves manifest and lockfile AGREE. It does not
      # prove the deep specifiers our code resolves are reachable — and the two
      # composition paths fail in opposite directions here:
      #
      #   ci.yml canonicalizes only CONFLICTED files, so a leaf's root-manifest
      #   addition can auto-merge in while the conflicting lockfile is reset to
      #   nv-main's — that is loud (ERR_PNPM_OUTDATED_LOCKFILE, PR #1136).
      #
      #   setup/merge-train.sh canonicalizes the ENTIRE owned set, so the same
      #   addition is discarded outright. Install stays green, deploy stays
      #   green, and the dashboard's cost panel reports "unavailable" forever.
      #
      # Only a resolution assertion catches the silent one.
      - name: Assert runtime specifiers resolve in the composed tree
        run: pnpm run check:runtime-deps

      - name: Install agent-runner deps (Bun)
        working-directory: container/agent-runner
        run: bun install --frozen-lockfile

      # scripts/check-nv-owned-drift.sh resolves nv-main ownership through
      # .github/nv-path-guard/ownership.py — the same matcher the nv-path-guard
      # workflow uses, so the two can never disagree about what nv-main owns.
      # setup/nv-owned-drift.test.ts and setup/ownership-matcher.test.ts
      # exercise it here. It needs python3 and git and nothing else: no install
      # step, so a sibling PR running an older ci.yml (which cannot compose the
      # workflow it is already executing) still has everything the composed
      # tests require.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      # The Python tail of this repo — the path-guard matcher, the KB
      # observability producers, the task dumper, regression-quality, and the
      # supervise-issues / learnings-wiki skill scripts — had no linter at all,
      # while the TypeScript side has had `tsc` plus the ratcheted gate below
      # for months. Several of these run on a production cron and decide whether
      # the KB is reported healthy, so a silent break there does not fail a
      # build; it just starts publishing a wrong number.
      #
      # The version is pinned EXACTLY, and config lives in ruff.toml, which does
      # not override the rule selection. That combination is what makes the gate
      # deterministic: a new ruff release cannot turn an unrelated PR red, and
      # bumping the pin surfaces the new findings as a reviewed diff. Do not
      # relax this to a range.
      #
      # Scoped to THIS branch's Python, not the composed tree's. The merge step
      # at the top pulls every nv-* sibling in, and the siblings carry Python
      # this branch does not have and may not touch: nv-slang's
      # container/mcp-servers/** (deleted on nv-main) and the slang*-pr-approver
      # skills (overlay-owned) are 75 findings that no nv-main PR can fix — the
      # files are not even in its tree. A bare `ruff check .` fails every nv-main
      # PR on a neighbour's code, which is the "a nv-main change breaks sibling
      # CI" class from #1134 pointed the other way. Each branch answers for its
      # own Python; a sibling that wants this gate gets it by picking up this
      # ci.yml, already linting exactly its own files.
      #
      # HEAD_SHA is the PR's own tip, so the list cannot be widened by the merge.
      # A branch behind nv-main simply will not lint files added since it forked
      # — under-inclusive, never wrong-blaming. The -f test drops anything a
      # sibling's deletion carried off, so the only way this step fails is a real
      # lint error.
      - name: Lint Python (ruff)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -m pip install --quiet --disable-pip-version-check ruff==0.16.2
          ruff --version

          files=()
          while IFS= read -r -d '' f; do
            case "$f" in
              *.py) if [ -f "$f" ]; then files+=("$f"); fi ;;
            esac
          done < <(git ls-tree -r --name-only -z "$HEAD_SHA")

          if [ ${#files[@]} -eq 0 ]; then
            echo "::notice::no Python on this branch — nothing to lint"
            exit 0
          fi
          echo "linting ${#files[@]} file(s) from $HEAD_SHA"
          ruff check --output-format=github -- "${files[@]}"

      - name: Build (needed for fetch-skills + tests)
        run: pnpm run build

      - name: Upgrade gh CLI (need >= 2.90 for gh skill)
        run: |
          gh --version
          gh extension install github/gh-skill 2>/dev/null || true
          gh skill --help >/dev/null 2>&1 || {
            echo "Installing latest gh CLI..."
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update -qq && sudo apt-get install -y -qq gh
          }
          gh --version

      - name: Fetch external skills
        if: hashFiles('scripts/fetch-skills.sh') != ''
        # Authenticate `gh skill` blob fetches — unauthenticated fetches hit
        # GitHub's anonymous rate limit (HTTP 403) and silently drop skills,
        # which then fail validate:templates with "references unknown skill".
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/fetch-skills.sh

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck host
        run: pnpm exec tsc --noEmit

      # The step above only sees src/ — the project tsconfig is include:["src*"],
      # so setup/ (98 files) and scripts/ (38) were never typechecked by anything.
      # This widens the net and blocks NEW errors while carrying the pre-existing
      # ones in scripts/typecheck-baseline.txt, which may only shrink.
      - name: Typecheck gate (setup/ + scripts/, ratcheted)
        run: node scripts/typecheck-gate.mjs

      - name: Typecheck container
        run: pnpm exec tsc -p container/agent-runner/tsconfig.json --noEmit

      - name: Validate coworker templates
        run: pnpm run validate:templates

      - name: Host tests
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm exec vitest run

      - name: Container tests
        working-directory: container/agent-runner
        run: bun test

      # The learnings-wiki builder is Python embedded in a Markdown document, so no
      # compiler or typechecker ever sees it and its suite ran nowhere. It guards the
      # supersession lineage — the record that says a learning was deliberately retired —
      # where a silent regression deletes knowledge rather than breaking a build.
      - name: Container skill tests (Python)
        run: python3 container/skills/learnings-wiki/test_learnings_wiki.py

      # The costliest-session-digest tool is Python embedded in SKILL.md (the
      # container writes it out at runtime), so nothing else executes it. Its
      # pricing table must stay reconciled with dashboard/session-costs.ts; this
      # suite extracts the tool FROM SKILL.md and asserts pricing/dedup/gate shape
      # so a silent drift is caught rather than shipping a wrong cost figure.
      - name: Costliest-session digest tests (Python)
        run: python3 container/skills/costliest-session-digest/test_costliest_session.py

      # The KB observability producers are Python too, and their suite ran NOWHERE:
      # #1124 added 32 tests and CI never executed one of them, so the review's
      # "32/32 passed" was a hand-run that nothing repeats. These two tools decide
      # whether the KB is reported healthy; a silent regression here does not break a
      # build, it just starts saying everything is fine.
      - name: KB observability tests (Python)
        run: python3 scripts/test_kb_observability.py

      # The committed scheduled-task snapshot is the only record of what the live
      # agents are standing-instructed to do, and its whole value is that `git diff`
      # is a drift alarm. It is a PAIR — JSON plus Markdown mirror, stamped with a
      # shared content hash — and the two can come apart with nothing to show for it:
      # a crash between the sequential renames, which no in-process rollback can
      # cover, or a hand-edit of a committed file. Either leaves a snapshot that
      # still reads as authoritative.
      #
      # `--check` recomputes the hash and compares the pair. It returns before `ncl`
      # is invoked, so it needs no live host, no DB and no network — which is what
      # makes it runnable here rather than only on the box that dumps it. What it
      # does NOT do is compare the snapshot against the live host; that is
      # scripts/kb-doctor.py's job and it needs the host to do it.
      - name: Scheduled-task snapshots agree with themselves
        run: bash scripts/check-task-snapshots.sh

      # The compose step above cannot test its own conflict resolution: it only
      # exercises the paths that happen to conflict on this PR. This builds the
      # modify/delete case on purpose, against all three copies of that loop.
      - name: Compose paths resolve modify/delete conflicts
        run: bash scripts/check-compose-conflict-resolution.sh

  # Repository rules require exact `ci`; always run it so matrix failures remain blocking.
  ci:
    if: always()
    needs: test
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success
